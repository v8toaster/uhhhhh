<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hold the Line</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f3ee;
  --surface: #eceae4;
  --border: #d4d0c8;
  --text: #1a1916;
  --muted: #8a8780;
  --accent: #1a1916;
  --mid-line: #c0392b;
  --fill: #2c2c2a;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity 0.3s ease;
}
.screen.hidden { opacity: 0; pointer-events: none; }

/* START */
#start-screen { gap: 2rem; padding: 2rem; }

.game-title {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  font-size: clamp(2.8rem, 12vw, 5.5rem);
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--text);
  text-align: center;
}
.game-title span { font-weight: 500; }

.rule-card {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1.5rem 1.75rem;
  max-width: 320px;
  width: 90%;
  background: var(--surface);
}
.rule-card p {
  font-size: 0.72rem;
  line-height: 2;
  color: var(--muted);
}
.rule-card .hi { color: var(--text); font-weight: 600; }

.start-btn {
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 2px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  padding: 0.85rem 3rem;
  cursor: pointer;
  transition: opacity 0.15s;
}
.start-btn:active { opacity: 0.75; }

/* COUNTDOWN */
#countdown-screen { gap: 0.5rem; }
.countdown-num {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  font-size: clamp(7rem, 35vw, 14rem);
  line-height: 1;
  color: var(--text);
  transition: transform 0.1s ease;
}
.countdown-label {
  font-size: 0.65rem;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
}

/* GAME */
#game-screen {
  flex-direction: row;
  align-items: stretch;
  padding: 0;
  gap: 0;
}

/* left tap button */
.btn-side {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: none;
  cursor: pointer;
  transition: background 0.08s;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.btn-side:active, .btn-side.pressed {
  background: var(--border);
}
.btn-side-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  pointer-events: none;
}
.btn-side-arrow {
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 16px solid var(--border);
  transition: border-bottom-color 0.08s;
}
.btn-side.pressed .btn-side-arrow,
.btn-side:active .btn-side-arrow { border-bottom-color: var(--muted); }

.btn-side-label {
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: var(--muted);
  text-transform: uppercase;
}

/* METER CENTER */
.meter-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 0;
  width: 120px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

.hud-top, .hud-bot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
  width: 100%;
  text-align: center;
}
.hud-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.8rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
}
.hud-lbl {
  font-size: 0.55rem;
  letter-spacing: 0.25em;
  color: var(--muted);
  text-transform: uppercase;
}

/* METER TRACK */
.meter-wrap {
  position: relative;
  width: 32px;
  height: min(58vh, 460px);
  flex-shrink: 0;
}

.meter-track {
  position: absolute;
  inset: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: visible;
}

.meter-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--fill);
  border-radius: 0;
  will-change: height;
}

/* 50% marker line across full width */
.mid-line {
  position: absolute;
  left: -8px; right: -8px;
  top: 50%;
  height: 1px;
  background: var(--mid-line);
  pointer-events: none;
}
.mid-line::after {
  content: '50';
  position: absolute;
  right: -28px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.5rem;
  color: var(--mid-line);
  letter-spacing: 0.05em;
}
.mid-line-left-label {
  position: absolute;
  left: -28px;
  top: -6px;
  font-size: 0.5rem;
  color: var(--mid-line);
}

/* tick labels */
.ticks {
  position: absolute;
  right: -26px;
  top: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
}
.tk {
  font-size: 0.48rem;
  color: var(--border);
  line-height: 1;
}

/* pointer needle */
.needle {
  position: absolute;
  left: -12px; right: -12px;
  height: 2px;
  background: var(--text);
  pointer-events: none;
  will-change: bottom;
  transform: translateY(1px);
}
.needle::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px;
  background: var(--text);
  border-radius: 50%;
}
.needle::after {
  content: '';
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px;
  background: var(--text);
  border-radius: 50%;
}

/* END SCREEN */
#end-screen { gap: 0.75rem; }

.end-title {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  font-size: clamp(1.8rem, 8vw, 3.5rem);
  color: var(--muted);
  letter-spacing: -0.01em;
}
.final-score-num {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
  font-size: clamp(4.5rem, 20vw, 9rem);
  color: var(--text);
  line-height: 0.9;
}
.score-lbl {
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 0.25rem;
}
.grade-lbl {
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 0.25rem;
}
.restart-btn {
  margin-top: 1.25rem;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 2px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0.75rem 2rem;
  cursor: pointer;
  transition: background 0.15s;
}
.restart-btn:hover { background: var(--surface); }
.restart-btn:active { background: var(--border); }
</style>
</head>
<body>

<!-- START -->
<div class="screen" id="start-screen">
  <div class="game-title">hold<br><span>the line</span></div>
  <div class="rule-card">
    <p>
      Tap <span class="hi">left</span> or <span class="hi">right</span> to push the needle up.<br>
      It falls due to gravity — keep tapping.<br><br>
      The closer to <span class="hi">50%</span>, the higher your score.<br>
      Exactly at 50% scores low. Far from 50% scores more.<br><br>
      <span class="hi">60 seconds.</span>
    </p>
  </div>
  <button class="start-btn" id="start-btn">START</button>
</div>

<!-- COUNTDOWN -->
<div class="screen hidden" id="countdown-screen">
  <div class="countdown-num" id="countdown-num">3</div>
  <div class="countdown-label">get ready</div>
</div>

<!-- GAME -->
<div class="screen hidden" id="game-screen">

  <button class="btn-side" id="btn-l" aria-label="Left tap button">
    <div class="btn-side-inner">
      <div class="btn-side-arrow"></div>
      <span class="btn-side-label">left</span>
    </div>
  </button>

  <div class="meter-center">
    <div class="hud-top">
      <div class="hud-num" id="score-val">0</div>
      <div class="hud-lbl">score</div>
    </div>

    <div class="meter-wrap">
      <div class="meter-track" id="meter-track">
        <div class="meter-fill" id="meter-fill"></div>
        <div class="mid-line"></div>
        <div class="needle" id="needle"></div>
      </div>
      <div class="ticks">
        <span class="tk">100</span>
        <span class="tk">75</span>
        <span class="tk">&nbsp;</span>
        <span class="tk">25</span>
        <span class="tk">0</span>
      </div>
    </div>

    <div class="hud-bot">
      <div class="hud-num" id="timer-val">60</div>
      <div class="hud-lbl">sec</div>
    </div>
  </div>

  <button class="btn-side" id="btn-r" aria-label="Right tap button">
    <div class="btn-side-inner">
      <div class="btn-side-arrow"></div>
      <span class="btn-side-label">right</span>
    </div>
  </button>

</div>

<!-- END -->
<div class="screen hidden" id="end-screen">
  <div class="end-title">time's up</div>
  <div class="score-lbl">your score</div>
  <div class="final-score-num" id="final-score">0</div>
  <div class="grade-lbl" id="grade-lbl"></div>
  <button class="restart-btn" id="restart-btn">play again</button>
</div>

<script>
const $ = id => document.getElementById(id);

const GAME_DURATION = 60;
const BOOST = 1.5;
// gravity: velocity increases over time (quadratic fall)
// v0 = 0 when needle is stationary or after tap boost
// acceleration in %/s^2
const GRAVITY = 28;

let level = 0;
let velocity = 0; // downward velocity in %/s (positive = falling)
let score = 0;
let timeLeft = GAME_DURATION;
let gameActive = false;
let lastTs = null;
let animId = null;

function setScreen(id) {
  ['start-screen','countdown-screen','game-screen','end-screen'].forEach(s => {
    $(s).classList.toggle('hidden', s !== id);
  });
}

function runCountdown(cb) {
  setScreen('countdown-screen');
  const steps = ['3','2','1','GO'];
  let i = 0;
  const show = () => {
    if (i >= steps.length) { cb(); return; }
    const el = $('countdown-num');
    el.textContent = steps[i];
    el.style.transform = 'scale(1.15)';
    setTimeout(() => { el.style.transform = 'scale(1)'; }, 100);
    i++;
    setTimeout(show, 750);
  };
  show();
}

function updateUI() {
  const pct = Math.max(0, Math.min(100, level));
  $('meter-fill').style.height = pct + '%';
  $('needle').style.bottom = pct + '%';
}

// Score formula: proportional to distance from 50, scaled so:
// dist=0 (at 50%) -> ~5 pts/s, dist=50 (at 0 or 100%) -> ~50 pts/s
// linear interpolation: pts/s = 5 + (50-5) * (dist/50) = 5 + 0.9*dist
function scoreRate(pct) {
  const dist = Math.abs(pct - 50);
  return 5 + (50 - 5) * (dist / 50);
}

function gameLoop(ts) {
  if (!gameActive) return;
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05); // cap at 50ms
  lastTs = ts;

  // quadratic gravity: velocity increases with acceleration
  velocity += GRAVITY * dt;
  level = Math.max(0, level - velocity * dt);

  // when hits floor, stop velocity
  if (level <= 0) velocity = 0;

  timeLeft = Math.max(0, timeLeft - dt);

  // scoring
  const pct = Math.max(0, Math.min(100, level));
  score += scoreRate(pct) * dt;

  $('score-val').textContent = Math.floor(score);
  $('timer-val').textContent = Math.ceil(timeLeft);
  updateUI();

  if (timeLeft <= 0) { endGame(); return; }
  animId = requestAnimationFrame(gameLoop);
}

function tap() {
  if (!gameActive) return;
  // each tap cancels some downward velocity and bumps level up
  velocity = Math.max(0, velocity - 15); // reduce fall speed
  level = Math.min(100, level + BOOST);
}

function startGame() {
  level = 0;
  velocity = 0;
  score = 0;
  timeLeft = GAME_DURATION;
  lastTs = null;
  gameActive = true;
  setScreen('game-screen');
  updateUI();
  animId = requestAnimationFrame(gameLoop);
}

function endGame() {
  gameActive = false;
  cancelAnimationFrame(animId);
  const fs = Math.floor(score);
  $('final-score').textContent = fs;
  let g = '';
  if (fs >= 2800) g = 'legendary';
  else if (fs >= 2400) g = 'master';
  else if (fs >= 1800) g = 'expert';
  else if (fs >= 1200) g = 'decent';
  else if (fs >= 600) g = 'keep going';
  else g = 'try again';
  $('grade-lbl').textContent = g;
  setScreen('end-screen');
}

function addTap(btn) {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    tap();
    btn.classList.add('pressed');
  });
  btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
  btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
  btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
}

$('start-btn').addEventListener('click', () => runCountdown(startGame));
$('restart-btn').addEventListener('click', () => runCountdown(startGame));
addTap($('btn-l'));
addTap($('btn-r'));

document.addEventListener('keydown', e => {
  if (!gameActive) return;
  if (['ArrowLeft','ArrowRight','a','A','b','B',' '].includes(e.key)) {
    e.preventDefault(); tap();
  }
});
</script>
</body>
</html>
